[importlinter]
root_package = testpackage

[importlinter:contract:one]
name=Expected kept isolated contract (with allowed imports)
; high.blue imports utils, indirect.yellow and indirect.brown, which are all allowed.
type=isolated
modules=
    testpackage.high.blue
allowed_imports=
    testpackage.utils
    testpackage.indirect

[importlinter:contract:two]
name=Expected kept isolated contract (with ignored imports)
type=isolated
modules=
    testpackage.high.blue
ignore_imports=
    testpackage.high.blue.one -> testpackage.utils
    testpackage.high.blue.one -> testpackage.indirect.yellow
    testpackage.high.blue.two -> testpackage.indirect.brown
