[importlinter]
root_package = testpackage

[importlinter:contract:one]
name=Expected kept encapsulated contract
type=encapsulated
modules=
    testpackage.high.blue
ignore_imports=
    testpackage.high.blue.one -> testpackage.utils
    testpackage.high.blue.one -> testpackage.indirect.yellow
    testpackage.high.blue.two -> testpackage.indirect.brown

[importlinter:contract:two]
name=Expected kept encapsulated contract (with a scope)
; high.blue imports modules outside testpackage.high, but they are not in scope.
type=encapsulated
modules=
    testpackage.high.blue
scope=
    testpackage.high
