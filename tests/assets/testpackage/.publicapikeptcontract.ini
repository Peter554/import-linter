[importlinter]
root_package = testpackage

[importlinter:contract:one]
name=Expected kept public_api contract
; utils, indirect.brown and indirect.yellow import high.green, which is public.
type=public_api
modules=
    testpackage.high
public_modules=
    testpackage.high.green

[importlinter:contract:two]
name=Expected kept public_api contract (with ignored imports)
; utils, indirect.brown and indirect.yellow import high.green, which isn't public, but the imports are ignored.
type=public_api
modules=
    testpackage.high
public_modules=
    testpackage.high.blue
ignore_imports=
    testpackage.utils -> testpackage.high.green
    testpackage.indirect.brown -> testpackage.high.green
    testpackage.indirect.yellow -> testpackage.high.green
