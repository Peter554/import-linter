name: Release process
# Releases on Pypi when a version tag is pushed.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Build a binary wheel and a source tarball
        run: "uv run --with=build python -m build --sdist --wheel --outdir dist/"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    # Must match the environment name configured on PyPI's trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/import-linter
    permissions:
      # Required for PyPI trusted publishing (OIDC). Only this job has it.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
